    <text x="214" y="178" font-family="Fredoka, Arial Rounded MT Bold, Arial, sans-serif" font-weight="700" font-size="54" fill="#e2366f">A</text>
    <path d="M293 330 C 240 292 222 266 222 240 C 222 218 239 202 260 202 C 275 202 287 211 293 224 C 299 211 311 202 326 202 C 347 202 364 218 364 240 C 364 266 346 292 293 330 Z" fill="#ff4d7e"/>
  </g>
