<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="20%" r="90%">
      <stop offset="0" stop-color="#ffe4ee"/>
      <stop offset="0.55" stop-color="#ff9ec0"/>
      <stop offset="1" stop-color="#e86c9a"/>
    </radialGradient>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9b6ff"/>
      <stop offset="1" stop-color="#8f6fe0"/>
